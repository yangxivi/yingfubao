name: Supabase Keep-Alive

# 防止 Supabase 免费层项目因不活跃被自动暂停（2026-09 曾因间隔过长被暂停过一次）。
# 每天定时 ping 一次 Supabase REST 制造活跃连接（每次约 20s，月耗 Actions 额度 ~10 分钟）。
# 失败仅告警不阻塞——项目若已被暂停，需要到 Supabase Dashboard 手动 Resume。
on:
  schedule:
    - cron: '23 4 * * *'        # 每天 UTC 04:23（北京 12:23）
  workflow_dispatch:             # 可在 Actions 页面手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to stay active
        run: |
          URL="${{ secrets.SUPABASE_URL }}/rest/v1/invoices?select=id&limit=1"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase ping HTTP status: $HTTP"
          if [ "$HTTP" = "200" ]; then
            echo "keep-alive OK, project stays active"
          else
            echo "::warning::keep-alive HTTP=$HTTP - 项目可能已暂停，请到 Supabase Dashboard 手动 Resume"
          fi
